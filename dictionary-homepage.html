<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Antiquated Dictionary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #searchInput {
      margin-bottom: 10px;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .item {
      padding: 8px;
      border: 1px solid #ddd;
      margin-bottom: 5px;
    }
    .hidden {
      display: none;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Antiquated Dictionary</h1>
  <input type="text" id="searchInput" placeholder="Search items...">
  <div id="itemList">
    <a href="you.html"><div class="item">You</div></a>
    <a href="the.html"><div class="item">The</div></a>
    <a href="a.html"><div class="item">A</div></a>
    <a href="and.html"><div class="item">And</div></a>
    <a href="doctor.html"><div class="item">Doctor/Physician</div></a>
    <a href="hello.html"><div class="item">Hello</div></a>
    <a href="find.html"><div class="item">Find</div></a>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const items = document.querySelectorAll('.item');

    searchInput.addEventListener('input', () => {
      const filter = searchInput.value.toLowerCase();
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.classList.toggle('hidden', !text.includes(filter));
      });
    });
  </script>
</body>
</html>>
